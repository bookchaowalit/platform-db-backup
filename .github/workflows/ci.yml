# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Unit tests (scripts/lib.sh helpers, run in bash from Python's unittest)
        run: python3 -m unittest discover -s tests -v
      - name: Build image
        run: docker build --tag db-backup:ci .
      - name: Smoke test (missing config fails fast)
        run: |
          set +e
          docker run --rm db-backup:ci
          code_backup=$?
          docker run --rm db-backup:ci /app/scripts/restore-drill.sh
          code_drill=$?
          test "$code_backup" -eq 2 && test "$code_drill" -eq 2
  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1

  image:
    # Builds the Dockerfile and scans the image with Trivy (packages inside the image, which the
    # Trivy fs scan cannot see). Blocking: a fixable HIGH/CRITICAL finding fails CI (and so Railway's Wait for CI).
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/image-scan.yml@b9957cccb3cc202e9e1a08df01924b8270d796df # v1.6.3
